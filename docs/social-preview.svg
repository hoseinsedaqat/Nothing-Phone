<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-20%" r="120%">
      <stop offset="0%" stop-color="#1d1d24"/>
      <stop offset="55%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D71921" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44444c"/>
      <stop offset="45%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#36363d"/>
    </linearGradient>
    <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="300" fill="url(#redGlow)"/>
  <circle cx="90" cy="620" r="260" fill="url(#redGlow)" opacity="0.6"/>

  <!-- dot-matrix N, 5x5 -->
  <g transform="translate(110, 86)">
    <g fill="#2c2c33">
      <circle cx="0" cy="0" r="9"/><circle cx="34" cy="0" r="9"/><circle cx="68" cy="0" r="9"/><circle cx="102" cy="0" r="9"/><circle cx="136" cy="0" r="9"/>
      <circle cx="0" cy="34" r="9"/><circle cx="34" cy="34" r="9"/><circle cx="68" cy="34" r="9"/><circle cx="102" cy="34" r="9"/><circle cx="136" cy="34" r="9"/>
      <circle cx="0" cy="68" r="9"/><circle cx="34" cy="68" r="9"/><circle cx="68" cy="68" r="9"/><circle cx="102" cy="68" r="9"/><circle cx="136" cy="68" r="9"/>
      <circle cx="0" cy="102" r="9"/><circle cx="34" cy="102" r="9"/><circle cx="68" cy="102" r="9"/><circle cx="102" cy="102" r="9"/><circle cx="136" cy="102" r="9"/>
      <circle cx="0" cy="136" r="9"/><circle cx="34" cy="136" r="9"/><circle cx="68" cy="136" r="9"/><circle cx="102" cy="136" r="9"/><circle cx="136" cy="136" r="9"/>
    </g>
    <g fill="#D71921">
      <circle cx="0" cy="0" r="9"/><circle cx="0" cy="34" r="9"/><circle cx="0" cy="68" r="9"/><circle cx="0" cy="102" r="9"/><circle cx="0" cy="136" r="9"/>
      <circle cx="34" cy="34" r="9"/><circle cx="68" cy="68" r="9"/><circle cx="102" cy="102" r="9"/>
      <circle cx="136" cy="0" r="9"/><circle cx="136" cy="34" r="9"/><circle cx="136" cy="68" r="9"/><circle cx="136" cy="102" r="9"/><circle cx="136" cy="136" r="9"/>
    </g>
  </g>

  <!-- title -->
  <text x="110" y="286" fill="#f5f5f7" font-size="62" font-weight="700" letter-spacing="1">NOTHING PHONE (3)</text>
  <text x="112" y="336" fill="#9a9aa2" font-size="24" font-weight="400" letter-spacing="4">INTERACTIVE WEB SIMULATOR · NOTHING OS 5.0</text>
  <rect x="112" y="362" width="170" height="6" rx="3" fill="#D71921"/>

  <!-- feature pills -->
  <g font-size="20" fill="#d6d6dc">
    <g transform="translate(112, 428)">
      <rect width="212" height="54" rx="27" fill="#16161a" stroke="#2a2a30"/>
      <text x="106" y="35" text-anchor="middle">16 working apps</text>
    </g>
    <g transform="translate(340, 428)">
      <rect width="242" height="54" rx="27" fill="#16161a" stroke="#2a2a30"/>
      <text x="121" y="35" text-anchor="middle">Glyph Matrix + sound</text>
    </g>
    <g transform="translate(592, 428)">
      <rect width="272" height="54" rx="27" fill="#16161a" stroke="#2a2a30"/>
      <text x="136" y="35" text-anchor="middle">Offline PWA, zero backend</text>
    </g>
  </g>
  <text x="112" y="560" fill="#5d5d63" font-size="16" letter-spacing="2">REACT · TYPESCRIPT · VITE · WEB AUDIO · FRAMER MOTION</text>

  <!-- phone -->
  <g transform="translate(1000, 76)">
    <rect x="0" y="0" width="180" height="488" rx="40" fill="url(#frame)"/>
    <rect x="9" y="9" width="162" height="470" rx="32" fill="url(#wp)"/>
    <circle cx="90" cy="26" r="6" fill="#0a0c0f" stroke="#26262b" stroke-width="1.5"/>

    <!-- dot clock -->
    <g fill="#f5f5f7" opacity="0.92" transform="translate(40, 78)">
      <g>
        <circle cx="0" cy="0" r="4.2"/><circle cx="12" cy="0" r="4.2"/>
        <circle cx="0" cy="12" r="4.2"/><circle cx="12" cy="12" r="4.2"/>
        <circle cx="0" cy="24" r="4.2"/><circle cx="12" cy="24" r="4.2"/>
        <circle cx="0" cy="36" r="4.2"/><circle cx="12" cy="36" r="4.2"/>
        <circle cx="0" cy="48" r="4.2"/><circle cx="12" cy="48" r="4.2"/>
      </g>
      <g transform="translate(22,0)">
        <circle cx="12" cy="0" r="4.2"/><circle cx="12" cy="12" r="4.2"/>
        <circle cx="0" cy="24" r="4.2"/><circle cx="12" cy="24" r="4.2"/>
        <circle cx="0" cy="36" r="4.2"/><circle cx="12" cy="36" r="4.2"/>
        <circle cx="0" cy="48" r="4.2"/><circle cx="12" cy="48" r="4.2"/>
      </g>
      <g transform="translate(58,0)">
        <circle cx="0" cy="20" r="3"/><circle cx="12" cy="20" r="3"/>
        <circle cx="0" cy="34" r="3"/><circle cx="12" cy="34" r="3"/>
      </g>
      <g transform="translate(84,0)">
        <circle cx="12" cy="0" r="4.2"/><circle cx="0" cy="12" r="4.2"/><circle cx="12" cy="12" r="4.2"/>
        <circle cx="12" cy="24" r="4.2"/><circle cx="12" cy="36" r="4.2"/><circle cx="12" cy="48" r="4.2"/>
      </g>
    </g>

    <!-- app icons row -->
    <g transform="translate(30, 210)">
      <rect width="28" height="28" rx="8" fill="#1A73E8"/>
      <rect x="46" width="28" height="28" rx="8" fill="#0B57D0"/>
      <rect x="92" width="28" height="28" rx="8" fill="#EA4335"/>
      <rect y="52" width="28" height="28" rx="8" fill="#34A853"/>
      <rect x="46" y="52" width="28" height="28" rx="8" fill="#FBBC05"/>
      <rect x="92" y="52" width="28" height="28" rx="8" fill="#202124"/>
    </g>

    <!-- red accent + home pill -->
    <circle cx="90" cy="360" r="5" fill="#D71921"/>
    <rect x="48" y="446" width="84" height="6" rx="3" fill="#f5f5f7" opacity="0.85"/>
  </g>
</svg>
