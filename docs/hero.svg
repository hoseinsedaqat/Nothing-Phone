<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="110%">
      <stop offset="0%" stop-color="#1b1b21"/>
      <stop offset="55%" stop-color="#0c0c0f"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D71921" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3c42"/>
      <stop offset="45%" stop-color="#151518"/>
      <stop offset="100%" stop-color="#33333a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1030" cy="80" r="260" fill="url(#red)"/>
  <circle cx="120" cy="380" r="220" fill="url(#red)" opacity="0.55"/>

  <!-- dot-matrix N -->
  <g transform="translate(96, 118)">
    <g fill="#2c2c33">
      <circle cx="0" cy="0" r="7"/><circle cx="26" cy="0" r="7"/><circle cx="52" cy="0" r="7"/><circle cx="78" cy="0" r="7"/><circle cx="104" cy="0" r="7"/>
      <circle cx="0" cy="26" r="7"/><circle cx="26" cy="26" r="7"/><circle cx="52" cy="26" r="7"/><circle cx="78" cy="26" r="7"/><circle cx="104" cy="26" r="7"/>
      <circle cx="0" cy="52" r="7"/><circle cx="26" cy="52" r="7"/><circle cx="52" cy="52" r="7"/><circle cx="78" cy="52" r="7"/><circle cx="104" cy="52" r="7"/>
      <circle cx="0" cy="78" r="7"/><circle cx="26" cy="78" r="7"/><circle cx="52" cy="78" r="7"/><circle cx="78" cy="78" r="7"/><circle cx="104" cy="78" r="7"/>
      <circle cx="0" cy="104" r="7"/><circle cx="26" cy="104" r="7"/><circle cx="52" cy="104" r="7"/><circle cx="78" cy="104" r="7"/><circle cx="104" cy="104" r="7"/>
    </g>
    <g fill="#D71921">
      <circle cx="0" cy="0" r="7"/><circle cx="0" cy="26" r="7"/><circle cx="0" cy="52" r="7"/><circle cx="0" cy="78" r="7"/><circle cx="0" cy="104" r="7"/>
      <circle cx="26" cy="26" r="7"/><circle cx="52" cy="52" r="7"/><circle cx="78" cy="78" r="7"/>
      <circle cx="104" cy="0" r="7"/><circle cx="104" cy="26" r="7"/><circle cx="104" cy="52" r="7"/><circle cx="104" cy="78" r="7"/><circle cx="104" cy="104" r="7"/>
    </g>
  </g>

  <!-- title block -->
  <text x="250" y="160" fill="#f5f5f7" font-size="58" font-weight="700" letter-spacing="2">NOTHING PHONE (3)</text>
  <text x="252" y="206" fill="#9a9aa2" font-size="26" font-weight="400" letter-spacing="6">INTERACTIVE WEB SIMULATOR · NOTHING OS 5.0</text>
  <rect x="252" y="236" width="150" height="4" rx="2" fill="#D71921"/>

  <!-- feature pills -->
  <g font-size="17" fill="#cfcfd6">
    <g transform="translate(252, 286)">
      <rect width="196" height="44" rx="22" fill="#16161a" stroke="#2a2a30"/>
      <text x="98" y="28" text-anchor="middle">16 working apps</text>
    </g>
    <g transform="translate(462, 286)">
      <rect width="196" height="44" rx="22" fill="#16161a" stroke="#2a2a30"/>
      <text x="98" y="28" text-anchor="middle">Glyph Matrix + sound</text>
    </g>
    <g transform="translate(672, 286)">
      <rect width="214" height="44" rx="22" fill="#16161a" stroke="#2a2a30"/>
      <text x="107" y="28" text-anchor="middle">Offline PWA, zero backend</text>
    </g>
  </g>

  <!-- stylized phone -->
  <g transform="translate(995, 40)">
    <rect x="0" y="0" width="120" height="248" rx="26" fill="url(#frame)"/>
    <rect x="7" y="7" width="106" height="234" rx="20" fill="#000"/>
    <circle cx="60" cy="18" r="4.5" fill="#0a0c0f" stroke="#222"/>
    <g fill="#f5f5f7" opacity="0.9">
      <circle cx="34" cy="52" r="3.4"/><circle cx="44" cy="52" r="3.4"/><circle cx="54" cy="52" r="3.4"/><circle cx="64" cy="52" r="3.4"/><circle cx="74" cy="52" r="3.4"/><circle cx="84" cy="52" r="3.4"/>
      <circle cx="34" cy="64" r="3.4"/><circle cx="44" cy="64" r="3.4"/><circle cx="54" cy="64" r="3.4"/><circle cx="64" cy="64" r="3.4"/><circle cx="74" cy="64" r="3.4"/><circle cx="84" cy="64" r="3.4"/>
    </g>
    <g fill="#D71921">
      <circle cx="34" cy="52" r="3.4"/><circle cx="34" cy="64" r="3.4"/><circle cx="44" cy="64" r="3.4"/><circle cx="54" cy="52" r="3.4"/><circle cx="84" cy="52" r="3.4"/><circle cx="84" cy="64" r="3.4"/>
    </g>
    <rect x="30" y="218" width="60" height="5" rx="2.5" fill="#f5f5f7" opacity="0.85"/>
  </g>
</svg>
