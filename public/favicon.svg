    <circle cx="40" cy="40" r="5"/>
    <circle cx="52" cy="52" r="5"/>
    <circle cx="64" cy="64" r="5"/>
    <!-- column 5 -->
    <circle cx="76" cy="28" r="5"/>
    <circle cx="76" cy="40" r="5"/>
