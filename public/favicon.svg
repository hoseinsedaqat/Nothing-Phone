<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="24" fill="#0a0a0c"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" fill="none" stroke="#2a2a30" stroke-width="2"/>
